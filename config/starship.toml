"$schema" = 'https://starship.rs/config-schema.json'

# Two lines: useful context above, a full-width command line below.
palette = 'catppuccin_mocha'
add_newline = true
command_timeout = 1000
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$git_state\
$nodejs\
$python\
$rust\
$golang\
$cmd_duration\
$line_break\
$character"""

[directory]
style = 'bold fg:base bg:blue'
format = '[](blue)[  $path$read_only ]($style)[](blue) '
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = true
read_only = ' '
read_only_style = 'fg:red bg:blue'

[git_branch]
symbol = ''
style = 'bold fg:base bg:mauve'
format = '[](mauve)[ $symbol $branch ]($style)[](mauve) '

[git_status]
style = 'bold peach'
format = '([$all_status$ahead_behind]($style) )'
conflicted = '=$count '
ahead = '↑$count '
behind = '↓$count '
diverged = '↑$ahead_count ↓$behind_count '
untracked = '?$count '
stashed = '*$count '
modified = '!$count '
staged = '+$count '
renamed = '»$count '
deleted = '×$count '

[git_state]
style = 'bold red'
format = '[\($state( $progress_current/$progress_total)\)]($style) '

[username]
show_always = false
style_user = 'bold yellow'
style_root = 'bold red'
format = '[$user]($style) '

[hostname]
ssh_only = true
style = 'bold yellow'
format = '[@$hostname]($style) '

[nodejs]
symbol = ' '
style = 'green'
format = '[$symbol($version )]($style)'

[python]
symbol = ' '
style = 'yellow'
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[rust]
symbol = ' '
style = 'peach'
format = '[$symbol($version )]($style)'

[golang]
symbol = ' '
style = 'sapphire'
format = '[$symbol($version )]($style)'

[cmd_duration]
min_time = 2000
style = 'overlay2'
format = '[󱎫 $duration]($style) '

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold mauve)'

[palettes.catppuccin_mocha]
rosewater = '#f5e0dc'
flamingo = '#f2cdcd'
pink = '#f5c2e7'
mauve = '#cba6f7'
red = '#f38ba8'
maroon = '#eba0ac'
peach = '#fab387'
yellow = '#f9e2af'
green = '#a6e3a1'
teal = '#94e2d5'
sky = '#89dceb'
sapphire = '#74c7ec'
blue = '#89b4fa'
lavender = '#b4befe'
text = '#cdd6f4'
subtext1 = '#bac2de'
subtext0 = '#a6adc8'
overlay2 = '#9399b2'
overlay1 = '#7f849c'
overlay0 = '#6c7086'
surface2 = '#585b70'
surface1 = '#45475a'
surface0 = '#313244'
base = '#1e1e2e'
mantle = '#181825'
crust = '#11111b'

# The same appearance and shortcuts as Josh's Linux setup; works on macOS too.
include mocha.conf

font_family JetBrainsMono Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12.0

window_padding_width 10
enabled_layouts splits,stack,tall
background_opacity 1.0
enable_audio_bell no
scrollback_lines 10000
scrollback_pager_history_size 32

cursor_shape beam
cursor_blink_interval 0
cursor_trail 3
cursor_trail_decay 0.1 0.2

tab_bar_min_tabs 2
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round
tab_title_template "{index}: {title}"
active_tab_font_style bold
inactive_tab_font_style normal

shell_integration enabled
map ctrl+shift+enter launch --cwd=current
map ctrl+shift+t launch --type=tab --cwd=current
map ctrl+shift+e launch --location=vsplit --cwd=current
map ctrl+shift+o launch --location=hsplit --cwd=current
map ctrl+shift+h neighboring_window left
map ctrl+shift+j neighboring_window down
map ctrl+shift+k neighboring_window up
map ctrl+shift+l neighboring_window right
